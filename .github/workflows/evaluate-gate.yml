name: Arenix Evaluate Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate leakage-safe Arenix Gate diagnostic
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python src/evaluate_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arenix-gate-diagnostic-0.1.0
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
