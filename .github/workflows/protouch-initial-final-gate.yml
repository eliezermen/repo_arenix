name: Arenix Protouch Initial Final Gate
on:
  workflow_dispatch:
jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "numpy==2.4.6" "pandas==2.3.3" "scikit-learn==1.9.1" "xgboost==3.2.0" "supabase==2.31.0" "joblib==1.6.0" "pyarrow==21.0.0"
      - name: Run final Protouch Initial gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python src/reevaluate_protouch_initial_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: arenix-protouch-initial-final-gate
          path: artifacts/protouch_initial_final_gate.json
          retention-days: 90
