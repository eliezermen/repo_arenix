name: Arenix Protouch Initial Final Gate
on:
  workflow_dispatch:
jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "numpy>=2,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2" "xgboost>=2.1,<4" "supabase>=2.10,<3" "joblib>=1.4,<2" "pyarrow>=15,<22"
      - name: Run final Protouch Initial gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python src/reevaluate_protouch_initial_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: arenix-protouch-initial-final-gate
          path: artifacts/protouch_initial_final_gate.json
          retention-days: 90
