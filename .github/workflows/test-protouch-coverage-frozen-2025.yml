name: Arenix Test Protouch Coverage Frozen 2025
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy pandas
      - uses: actions/download-artifact@v4
        with:
          name: arenix-protouch-coverage-weights-2024
          github-token: ${{ github.token }}
          run-id: 35912438052
          path: artifacts
      - name: Frozen 2025 test
        run: python src/test_protouch_coverage_frozen_2025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arenix-protouch-coverage-frozen-2025
          path: artifacts/protouch_coverage_frozen_2025.json
          retention-days: 30
