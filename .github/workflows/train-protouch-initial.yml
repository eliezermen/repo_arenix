name: Arenix Protouch Initial
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/train_protouch_initial.py'
      - '.github/workflows/train-protouch-initial.yml'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "numpy>=2,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2" "xgboost>=2.1,<4" "supabase>=2.10,<3" "joblib>=1.4,<2" "pyarrow>=15,<22"
      - name: Train, validate, test, preregister live
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python src/train_protouch_initial.py
      - uses: actions/upload-artifact@v4
        with:
          name: arenix-protouch-initial-0.1.0
          path: |
            artifacts/protouch_initial_manifest_0.1.0.json
            artifacts/protouch_initial_live_probs_2026.csv
            artifacts/protouch_initial_models_0.1.0.joblib
          retention-days: 90
