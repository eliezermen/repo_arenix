name: Arenix Train Protouch Multiclass
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train Protouch L-D-V models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python src/train_protouch_multiclass.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arenix-protouch-multiclass-0.1.0
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
